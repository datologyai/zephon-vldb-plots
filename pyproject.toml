[project]
name = "zephon-vldb-plots"
version = "0.1.0"
description = "Paper figures and frozen measurements for Zephon VLDB"
requires-python = ">=3.11"
dependencies = [
    "adjusttext>=1.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "polars>=1.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[project.scripts]
zephon-plots = "plotting.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plotting"]

[tool.hatch.build.targets.wheel.force-include]
paper_data = "paper_data"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"plotting/system/*.py" = ["E402"]
